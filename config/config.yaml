  - {key: nse_quote_equity, url_template: "https://www.nseindia.com/api/quote-equity?symbol={symbol}", response_kind: json, purpose: "Equity quote", requires_nse_session: true, required_parameters: [symbol], referer: "https://www.nseindia.com/get-quotes/equity?symbol={symbol}"}
  - {key: nse_quote_equity_trade_info, url_template: "https://www.nseindia.com/api/quote-equity?symbol={symbol}&section=trade_info", response_kind: json, purpose: "Equity trade delivery and depth information", requires_nse_session: true, required_parameters: [symbol], referer: "https://www.nseindia.com/get-quotes/equity?symbol={symbol}"}
  - {key: nse_index_nifty50, url_template: "https://www.nseindia.com/api/equity-stock-indices?index=NIFTY%2050", response_kind: json, purpose: "Nifty 50 constituents", requires_nse_session: true}
  - {key: nse_index_banknifty, url_template: "https://www.nseindia.com/api/equity-stock-indices?index=NIFTY%20BANK", response_kind: json, purpose: "Bank Nifty constituents", requires_nse_session: true}
  - {key: nse_index_midcap100, url_template: "https://www.nseindia.com/api/equity-stock-indices?index=NIFTY%20MIDCAP%20100", response_kind: json, purpose: "Midcap 100 constituents", requires_nse_session: true}
  - {key: nse_index_smallcap100, url_template: "https://www.nseindia.com/api/equity-stock-indices?index=NIFTY%20SMALLCAP%20100", response_kind: json, purpose: "Smallcap 100 constituents", requires_nse_session: true}
  - {key: nse_sector_constituents, url_template: "https://www.nseindia.com/api/equity-stock-indices?index={sector_index}", response_kind: json, purpose: "Sector index constituents for strongest/weakest sector stock ranking", requires_nse_session: true, required_parameters: [sector_index], normalized_source_key: nse_sector_constituents}
