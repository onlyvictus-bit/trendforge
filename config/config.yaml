  - {key: nse_option_chain_nifty, url_template: "https://www.nseindia.com/api/option-chain-equities?symbol=NIFTY", response_kind: json, purpose: "Nifty option chain", requires_nse_session: true, normalized_source_key: nse_option_chain, referer: "https://www.nseindia.com/option-chain", timeout_seconds: 45}
  - {key: nse_option_chain_banknifty, url_template: "https://www.nseindia.com/api/option-chain-equities?symbol=BANKNIFTY", response_kind: json, purpose: "Bank Nifty option chain", requires_nse_session: true, normalized_source_key: nse_option_chain, referer: "https://www.nseindia.com/option-chain", timeout_seconds: 45}
  - {key: nse_option_chain_equity, url_template: "https://www.nseindia.com/api/option-chain-v3?type=Equity&symbol={symbol}&expiry={expiry}", response_kind: json, purpose: "Bounded active-stock equity option chain for the nearest listed expiry", requires_nse_session: true, required_parameters: [symbol, expiry], normalized_source_key: nse_option_chain, referer: "https://www.nseindia.com/option-chain", timeout_seconds: 45}
  - {key: nse_oi_spurts, url_template: "https://www.nseindia.com/api/live-analysis-oi-spurts-underlyings", response_kind: json, purpose: "OI spurts", requires_nse_session: true, normalized_source_key: nse_oi_spurts}
