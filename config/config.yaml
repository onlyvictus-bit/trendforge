version: "1.0.0"

screening:
  bull_threshold: 1.5
  bear_threshold: -1.5
  neutral_zone: 0.8
  min_volume_lacs: 10.0
  max_pledge_pct: 30.0
  min_fii_net_crs: 5.0
  min_factor_coverage: 1.0
  min_direction_probability: 0.70

weights:
  smart_money: 0.25
  trend: 0.20
  volatility: 0.15
  momentum: 0.15
  fundamental: 0.10
  risk: 0.15

risk:
  account_size: 100000.0
  max_position_pct: 0.10
  kelly_fraction: 0.5
  stop_loss_atr_mult: 2.0
  var_confidence: 0.95
  max_open_positions: 3
  max_daily_loss_pct: 0.015
  max_sector_risk_share: 0.30
  correlation_threshold: 0.70

ai:
  hmm_n_components: 4
  isolation_forest_contamination: 0.05
  ensemble_weights:
    hmm: 0.40
    random_forest: 0.20
    xgboost: 0.30
    lstm: 0.10
  probability_slope: 1.5

apis:
  nse_base: "https://www.nseindia.com/api"
  bse_base: "https://api.bseindia.com/BseIndiaAPI/api"
  amfi_nav: "https://www.amfiindia.com/spages/NAVAll.txt"
  mfapi_base: "https://api.mfapi.in/mf"
  nsdl_fpi: "https://fpi.nsdl.co.in/web/Reports/Latest.aspx"

endpoint_contracts:
  - {key: upstox_company_profile, url_template: "https://api.upstox.com/v2/fundamentals/{isin}/profile", response_kind: json, purpose: "Read-only company profile and identity fundamentals from the free Upstox Analytics API", required_parameters: [isin], normalized_source_key: upstox_company_profile, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_key_ratios, url_template: "https://api.upstox.com/v2/fundamentals/{isin}/key-ratios", response_kind: json, purpose: "Read-only valuation profitability leverage and efficiency ratios from the free Upstox Analytics API", required_parameters: [isin], normalized_source_key: upstox_key_ratios, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_option_chain, url_template: "https://api.upstox.com/v2/option/chain?instrument_key={instrument_key}&expiry_date={expiry_date}", response_kind: json, purpose: "Read-only option chain with OI IV Greeks volume bid ask and underlying price", required_parameters: [instrument_key, expiry_date], normalized_source_key: upstox_option_chain, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_pcr_history, url_template: "https://api.upstox.com/v2/market/pcr?instrument_key={instrument_key}&expiry={expiry}&date={date}&bucket_interval={bucket_interval}", response_kind: json, purpose: "Read-only put-call-ratio history for a selected instrument expiry and date", required_parameters: [instrument_key, expiry, date, bucket_interval], normalized_source_key: upstox_pcr_history, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_full_market_quote, url_template: "https://api.upstox.com/v2/market-quote/quotes?instrument_key={instrument_key}", response_kind: json, purpose: "Read-only full quote with OHLC volume OI and exchange market depth", required_parameters: [instrument_key], normalized_source_key: upstox_full_market_quote, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_historical_candles, url_template: "https://api.upstox.com/v3/historical-candle/{instrument_key}/{unit}/{interval}/{to_date}/{from_date}", response_kind: json, purpose: "Read-only historical OHLCV and open-interest candles for technical research", required_parameters: [instrument_key, unit, interval, to_date, from_date], normalized_source_key: upstox_historical_candles, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 45}
  - {key: upstox_option_greeks, url_template: "https://api.upstox.com/v3/market-quote/option-greek?instrument_key={instrument_key}", response_kind: json, purpose: "Read-only provider-supplied option IV delta gamma theta vega volume and OI", required_parameters: [instrument_key], normalized_source_key: upstox_option_greeks, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_balance_sheet, url_template: "https://api.upstox.com/v2/fundamentals/{isin}/balance-sheet?type={statement_type}&fs={full_statement}", response_kind: json, purpose: "Read-only historical balance sheet in crore with optional provider line items", required_parameters: [isin, statement_type, full_statement], normalized_source_key: upstox_balance_sheet, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_cash_flow, url_template: "https://api.upstox.com/v2/fundamentals/{isin}/cash-flow?type={statement_type}&fs={full_statement}", response_kind: json, purpose: "Read-only historical operating investing and financing cash-flow values", required_parameters: [isin, statement_type, full_statement], normalized_source_key: upstox_cash_flow, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_income_statement, url_template: "https://api.upstox.com/v2/fundamentals/{isin}/income-statement?type={statement_type}&time_period={time_period}&fs={full_statement}", response_kind: json, purpose: "Read-only yearly or quarterly revenue operating-profit and net-profit history", required_parameters: [isin, statement_type, time_period, full_statement], normalized_source_key: upstox_income_statement, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_share_holdings, url_template: "https://api.upstox.com/v2/fundamentals/{isin}/share-holdings", response_kind: json, purpose: "Read-only quarterly promoter FII DII mutual-fund and public shareholding history", required_parameters: [isin], normalized_source_key: upstox_share_holdings, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_corporate_actions, url_template: "https://api.upstox.com/v2/fundamentals/{isin}/corporate-actions", response_kind: json, purpose: "Read-only dividends bonuses splits rights and their event dates", required_parameters: [isin], normalized_source_key: upstox_corporate_actions, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_competitors, url_template: "https://api.upstox.com/v2/fundamentals/{isin}/competitors", response_kind: json, purpose: "Read-only competitor identities profiles sectors and market-cap context", required_parameters: [isin], normalized_source_key: upstox_competitors, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_open_interest, url_template: "https://api.upstox.com/v2/market/oi?instrument_key={instrument_key}&expiry={expiry}&date={date}", response_kind: json, purpose: "Read-only aggregate and per-strike call and put open interest", required_parameters: [instrument_key, expiry, date], normalized_source_key: upstox_open_interest, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: upstox_max_pain, url_template: "https://api.upstox.com/v2/market/max-pain?instrument_key={instrument_key}&expiry={expiry}&date={date}&bucket_interval={bucket_interval}", response_kind: json, purpose: "Read-only daily and intraday max-pain observations", required_parameters: [instrument_key, expiry, date, bucket_interval], normalized_source_key: upstox_max_pain, contract_status: UNVERIFIED_RESEARCH, credential_env: UPSTOX_ANALYTICS_TOKEN, timeout_seconds: 30}
  - {key: nse_market_status, url_template: "https://www.nseindia.com/api/marketStatus", response_kind: json, purpose: "Official exchange session state and trade-date context", requires_nse_session: true, normalized_source_key: nse_market_status}
