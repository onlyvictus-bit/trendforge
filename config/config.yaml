  - {key: nse_live_equity_derivatives_stock_fut, url_template: "https://www.nseindia.com/api/liveEquity-derivatives?index=stock_fut", response_kind: json, purpose: "Most active stock futures by contract volume, OI, and underlying value", requires_nse_session: true, normalized_source_key: nse_live_equity_derivatives}
  - {key: nse_live_equity_derivatives_index_opt, url_template: "https://www.nseindia.com/api/liveEquity-derivatives?index=nse50_opt", response_kind: json, purpose: "Most active Nifty index options for regime, OI and volatility context only", requires_nse_session: true, normalized_source_key: nse_live_equity_derivatives}
