name: Atomic snapshot review source
on:
  push:
    branches: [fix/atomic-research-snapshot]
    paths: [.github/workflows/atomic-review-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source for isolated review
        run: git archive --format=tar HEAD -o /tmp/atomic-review-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: atomic-review-source
          path: /tmp/atomic-review-source.tar
          retention-days: 1
