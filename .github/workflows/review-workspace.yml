name: Temporary review workspace
on:
  push:
    branches: [fix/current-state-history, feat/rhist03-producer-wiring]
    paths: [.github/workflows/review-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar HEAD -o /tmp/trendforge-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: /tmp/trendforge-source.tar
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download pinned test dependencies for offline verification
        run: python -m pip download --only-binary=:all: -r backend/requirements-dev.txt -d /tmp/review-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: review-wheels
          path: /tmp/review-wheels
          retention-days: 1
