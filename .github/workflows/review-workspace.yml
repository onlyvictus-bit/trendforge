name: Temporary review workspace
on:
  push:
    branches: [fix/current-state-history, feat/rhist03-producer-wiring]
    paths: [.github/workflows/review-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar HEAD -o /tmp/trendforge-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: /tmp/trendforge-source.tar
          retention-days: 1
