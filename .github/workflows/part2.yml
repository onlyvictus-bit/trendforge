name: part2-spine-probe

# TEMPORARY judge-run workflow: Part 2 (cash research spine) evidence on Linux.
# Removed after the comparison run. Not part of the build.
on:
  workflow_dispatch:

jobs:
  part2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run Part 2 spine tests (verbose)
        run: |
          mkdir -p delete/part2_ci_20260905
          cd backend
          for f in test_attention_order.py test_cash_a1_staging.py test_cash_a2_identity.py test_cash_a3_discovery.py test_cash_a4_history.py test_cash_a5_c1.py test_cash_post_commit_pipeline.py test_r14_live_ca_join.py test_r4_live_identity_pin.py test_r5_live_structure.py test_r1_live_decision.py; do echo "tests/$f"; done | tee ../delete/part2_ci_20260905/test_list.txt
          python -m pytest $(cat ../delete/part2_ci_20260905/test_list.txt | tr '\n' ' ') -v -p no:cacheprovider 2>&1 | tee ../delete/part2_ci_20260905/pytest.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Spine build + hash-linkage probe
        run: |
          cat > /tmp/probe_part2.py <<'PROBE_EOF'
          import json, os, sys
          from pathlib import Path
          out_dir = Path(sys.argv[1]); out_dir.mkdir(parents=True, exist_ok=True)
          class _MP:
              @staticmethod
              def setattr(obj, name, value): setattr(obj, name, value)
          from trendforge_api import storage
          from trendforge_api.hybrid_v2.tests_support.fixtures import persist_overlay_lineage
          from trendforge_api.selection.attention_order import latest_attention_order
          from trendforge_api.selection.inventory_source_bundle import latest_inventory_source_bundle
          from trendforge_api.selection.r14_live import latest_r14_ca_join
          from trendforge_api.selection.r4_live import latest_r4_identity_pin
          from trendforge_api.selection.r5_live import latest_r5_structure_batch
          parts = persist_overlay_lineage(out_dir, _MP(), with_structure=True)
          storage.DB_PATH = out_dir / "hybrid-overlay.db"
          bundle = latest_inventory_source_bundle()
          attention = latest_attention_order()
          pin = latest_r4_identity_pin()
          ca_join = latest_r14_ca_join()
          r5 = latest_r5_structure_batch()
          checks = {"r1_bundle_present": bundle is not None,
                    "r2_attention_present": attention is not None,
                    "r4_pin_present": pin is not None,
                    "r14_ca_join_present": ca_join is not None,
                    "r5_structure_present": r5 is not None}
          links = {}
          if bundle is not None and attention is not None:
              links["r2_r1_bundle_hash_match"] = attention.r1_bundle_hash == bundle.bundle_hash
          if bundle is not None and r5 is not None:
              links["r5_r1_bundle_hash_match"] = r5.r1_bundle_hash == bundle.bundle_hash
          if attention is not None and r5 is not None:
              links["r5_r2_run_hash_match"] = r5.r2_run_hash == attention.run_hash
          if ca_join is not None and r5 is not None:
              links["r5_r14_run_hash_match"] = r5.r14_run_hash == ca_join.run_hash
          if pin is not None and bundle is not None:
              ph = getattr(pin, "r1_bundle_hash", None)
              links["r4_r1_bundle_hash_match"] = ph == bundle.bundle_hash if ph else "unchecked"
          if ca_join is not None and bundle is not None:
              ch = getattr(ca_join, "r1_bundle_hash", None)
              links["r14_r1_bundle_hash_match"] = ch == bundle.bundle_hash if ch else "unchecked"
          report = {"stages_built": sorted(parts.keys()), "checks": checks, "links": links,
                    "row_counts": {"r1_stock_records": len(bundle.stock_records) if bundle else 0,
                                   "r2_rows": len(attention.rows) if attention else 0,
                                   "r5_rows": len(r5.rows) if r5 else 0},
                    "r5_run_hash": r5.run_hash if r5 else None,
                    "all_present": all(checks.values()),
                    "all_links_ok": all(v is True for v in links.values())}
          with open(out_dir / "spine.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=1, sort_keys=True, default=str)
          print("all_present:", report["all_present"])
          print("all_links_ok:", report["all_links_ok"])
          PROBE_EOF
          PYTHONPATH=backend python /tmp/probe_part2.py delete/part2_ci_20260905 | tee delete/part2_ci_20260905/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part2-ci
          path: delete/part2_ci_20260905/
          retention-days: 7

