name: part1-intake-probe

# TEMPORARY judge-run workflow: Part 1 (data intake) evidence on Linux.
# Removed after the comparison run. Not part of the build.
on:
  workflow_dispatch:

jobs:
  part1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run Part 1 intake tests (verbose)
        run: |
          mkdir -p delete/part1_ci_20260905
          cd backend
          ls tests/*.py | grep -E 'pars|source|storage|market_data|inventory|dual_lane|download|collector|resolver|scheduler' | tee ../delete/part1_ci_20260905/test_list.txt
          python -m pytest $(cat ../delete/part1_ci_20260905/test_list.txt | tr '\n' ' ') -v -p no:cacheprovider 2>&1 | tee ../delete/part1_ci_20260905/pytest.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Registry + storage round-trip probe
        run: |
          cat > /tmp/probe_part1.py <<'PROBE_EOF'
          import json, os, sys
          out_dir, tmp_db = sys.argv[1], sys.argv[2]
          os.environ["TRENDFORGE_DB_PATH"] = tmp_db
          from trendforge_api import storage
          from trendforge_api.models import SourceParseResult, SourceSnapshotRecord
          from trendforge_api.source_monitor import SOURCE_CATALOG
          os.makedirs(out_dir, exist_ok=True)
          registry = [{"key": d.key, "name": d.name, "url": d.url,
                       "authority": str(getattr(d.authority, "value", d.authority)),
                       "parser_status": d.parser_status,
                       "freshness_required": d.freshness_required,
                       "stale_after_hours": d.stale_after_hours} for d in SOURCE_CATALOG]
          with open(os.path.join(out_dir, "registry.json"), "w", encoding="utf-8") as fh:
              json.dump(registry, fh, indent=1, sort_keys=True)
          storage.init_db()
          snap = storage.save_source_snapshot(SourceSnapshotRecord(
              sourceKey="probe_source", name="Probe Source",
              url="https://example.invalid/probe", checkState="NEW",
              statusCode=200, contentHash="ab" * 32, contentLength=128,
              checkedAt="2026-09-05T00:00:00+00:00", changed=True))
          back = storage.get_latest_source_snapshot("probe_source")
          parsed = storage.save_source_parse_result(SourceParseResult(
              source_key="probe_source", snapshot_id=snap.id,
              parser_state="PARSED_STRUCTURED", data_date="2026-09-04",
              record_count=2, summary="probe rows",
              output={"rows": [{"a": 1}, {"a": 2}]},
              parsedAt="2026-09-05T00:00:00+00:00"))
          back2 = storage.get_latest_source_parse_result("probe_source")
          roundtrip = {
              "snapshot_saved_id": snap.id,
              "snapshot_read_back_ok": back is not None and back.content_hash == "ab" * 32,
              "parse_saved_id": parsed.id,
              "parse_read_back_ok": back2 is not None and back2.record_count == 2
                  and (back2.output.get("rows") or []) == [{"a": 1}, {"a": 2}],
          }
          with open(os.path.join(out_dir, "roundtrip.json"), "w", encoding="utf-8") as fh:
              json.dump(roundtrip, fh, indent=1, sort_keys=True)
          print("registry_entries:", len(registry))
          print("roundtrip_ok:", all(v for k, v in roundtrip.items() if k.endswith("_ok")))
          PROBE_EOF
          PYTHONPATH=backend python /tmp/probe_part1.py delete/part1_ci_20260905 delete/part1_ci_20260905/probe.db | tee delete/part1_ci_20260905/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part1-ci
          path: delete/part1_ci_20260905/
          retention-days: 7

