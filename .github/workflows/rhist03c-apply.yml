name: Apply verified R-HIST-03C implementation
on:
  push:
    branches: [feat/rhist03-producer-wiring]
    paths: [.github/workflows/rhist03c-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'onlyvictus-bit/trendforge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply only the locally tested and hash-verified patch
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import lzma
          import os
          import subprocess
          from pathlib import Path

          branch = 'feat/rhist03-producer-wiring'
          assert os.environ['GITHUB_REPOSITORY'] == 'onlyvictus-bit/trendforge'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          expected = {
              'backend/tests/test_r16_pit.py': '1ea418b9de2b2a9be01701204932912f44c99532d0434a61834f4d0ee2c8b27b',
              'backend/tests/test_r16_retention.py': '56f727dbf49d755dfe213d8b063f0299f5abd351d9b3f80d98aa4ecd96a9ea7f',
              'backend/trendforge_api/r16_retention.py': 'e124a532fe270e06d47340069ca449d1904fbad2bc91176b401c75bbead0cfbc',
              'backend/trendforge_api/s8_retention.py': '2add258992322cfa5606bfd7247dbcac28e00d830778e24a020fc99d14f2c26e',
              'backend/trendforge_api/selection/r16_metrics.py': '009ff4cfc0104a3b84937fb146ca327e0d2aedc76b29bd6306168573114a552a',
              'backend/trendforge_api/selection/r16_pit.py': '48541db7a0f89c7116823233573f02cea7644e9b36900def46ca6c30cc361c50',
              'backend/trendforge_api/selection/r16_service.py': 'c2555267c3ef64d73dd1246e59766930f0702afac98310973141e1c54a87b2fb',
              'backend/trendforge_api/selection/r16_store.py': '6712d4a8b6dad0b6e277e63039f07b3f3ee7d130f04a3d2db9b21017743655b2',
              'docs/BUILD_STATUS.md': '5b91883b9e0cca67784734deaa3a68153a3550146eaae62747e7d13fe44dd47f',
              'docs/CURRENT_STATE.md': '908d9c514573bdabfe2e3522414c9d955f64a88f5b56eda785e93ee146d1cb77',
              'docs/VALIDATION.md': '21bb0913bba723ebee84bd9d8b85e1178c5d518d0d4108048ff1cb14ad99bdd9',
          }
          patch = lzma.decompress(Path('.rhist03c-patch.0').read_bytes() + Path('.rhist03c-patch.1').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '6fffa9d8ba00c24b6cb989003aa3458ceefcad8352981aab16c337242520ba86'
          changed = subprocess.check_output(['git', 'apply', '--numstat', '-'], input=patch).decode().splitlines()
          assert {line.split('\t', 2)[2] for line in changed} == set(expected)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA']
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/' + branch], text=True).split()[0]
          assert remote == head, 'Branch moved; refusing to replace other work'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          for path, digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(staged) == set(expected)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'feat: wire R-HIST-03C exact-parent outcomes and immutable revisions'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          print('VERIFIED_IMPLEMENTATION_HEAD=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          PY
