name: part3-gates-probe

# TEMPORARY judge-run workflow: Part 3 (resolution/state/gates) evidence.
# Removed after the comparison run. Not part of the build.
on:
  workflow_dispatch:

jobs:
  part3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run Part 3 gates tests (verbose)
        run: |
          mkdir -p delete/part3_ci_20260905
          cd backend
          for f in test_pit_gate.py test_r2b_live_named_activation.py test_s3_cheap_discovery.py test_s4s5_compare.py test_s4_structure_pack.py test_s5_shortlist_enrichment.py test_s6_claim_feed.py test_s6_family_resolution.py test_s7_state_gates.py test_s8_persist_run.py test_s8_service.py test_s9_pit_homework.py test_tradability_gate.py test_tradability_sources.py; do echo "tests/$f"; done | tee ../delete/part3_ci_20260905/test_list.txt
          python -m pytest $(cat ../delete/part3_ci_20260905/test_list.txt | tr '\n' ' ') -v -p no:cacheprovider 2>&1 | tee ../delete/part3_ci_20260905/pytest.log
          test ${PIPESTATUS[0]} -eq 0
      - name: R2-B + S4 + S7 + PIT probe
        run: |
          cat > /tmp/probe_part3.py <<'PROBE_EOF'
          import json, sys
          from pathlib import Path
          out_dir = Path(sys.argv[1]); out_dir.mkdir(parents=True, exist_ok=True)
          class _MP:
              @staticmethod
              def setattr(obj, name, value): setattr(obj, name, value)
          from trendforge_api.hybrid_v2.tests_support.fixtures import persist_overlay_lineage
          from trendforge_api.selection.pit_gate import build_pit_gate
          from trendforge_api.selection.r2b_live import build_r2b_named_activation
          from trendforge_api.selection.s4_structure_pack import build_s4_structure_pack
          from trendforge_api.selection.s7_state_gates import build_s7_state
          parts = persist_overlay_lineage(out_dir, _MP(), with_structure=True)
          r5 = parts["structure"]
          ledger = build_r2b_named_activation()
          pack = build_s4_structure_pack(r5=r5)
          try:
              s7 = build_s7_state(r5=r5)
              s7_ok, s7_error = True, None
          except ValueError as exc:
              s7, s7_ok, s7_error = None, False, str(exc)
          pit = build_pit_gate(homework_payloads=[])
          states = {}
          if s7 is not None:
              for row in s7.rows:
                  states[str(row.public_state)] = states.get(str(row.public_state), 0) + 1
          report = {"r2b": {"authorized_count": ledger.authorized_count,
                             "may_confirm_count": ledger.may_confirm_count,
                             "source_activation_ready": ledger.source_activation_ready},
                    "s4_rows": len(pack.rows),
                    "s7": {"built_ok": s7_ok, "error": s7_error,
                           "confirmed_count": s7.confirmed_count if s7 is not None else None,
                           "source_activation_ready": s7.source_activation_ready if s7 is not None else None,
                           "public_states": states},
                    "pit_gate_empty_homework": pit.guidance_status}
          with open(out_dir / "gates.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=1, sort_keys=True, default=str)
          print("s7_built_ok:", s7_ok)
          print("pit_empty_status:", pit.guidance_status)
          print("r2b_ready:", ledger.source_activation_ready)
          PROBE_EOF
          PYTHONPATH=backend python /tmp/probe_part3.py delete/part3_ci_20260905 | tee delete/part3_ci_20260905/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part3-ci
          path: delete/part3_ci_20260905/
          retention-days: 7

