name: UI provenance regression
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/verify_requirement1_ui.py'
      - '.github/workflows/ui-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser tooling
        timeout-minutes: 3
        run: |
          python -m pip install --timeout 30 --retries 1 playwright==1.57.0
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME" ]; then
            echo "TRENDFORGE_QA_BROWSER=$CHROME" >> "$GITHUB_ENV"
          else
            python -m playwright install chromium
          fi
      - name: Frontend and documentation contracts
        run: |
          mkdir -p ui-verification
          set -o pipefail
          (cd frontend && npm test) 2>&1 | tee ui-verification/frontend.log
          python -m compileall -q scripts/verify_requirement1_ui.py
          git diff --check
      - name: Synthetic browser and responsive layout checks
        run: |
          set -o pipefail
          python scripts/verify_requirement1_ui.py 2>&1 | tee ui-verification/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-provenance-verification
          path: ui-verification/
          retention-days: 14
